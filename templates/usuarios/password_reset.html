{% extends 'base/base_login.html' %}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        
        <div class="text-center mb-4">
            <i class="fas fa-lock fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold">Esqueceu a Senha?</h3>
            <p class="text-muted small">
                Digite seu e-mail cadastrado e enviaremos um link para você criar uma nova senha.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_email" class="form-label-custom">E-mail</label>
                <input type="email" name="email" id="id_email" 
                       class="form-control form-control-custom" 
                       placeholder="exemplo@email.com" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 text-white fw-bold py-2">
                <i class="fas fa-paper-plane me-2"></i> Enviar Link
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <a href="{% url 'login' %}" class="text-decoration-none text-muted small">
                <i class="fas fa-arrow-left me-1"></i> Voltar para o Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
