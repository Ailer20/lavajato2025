{% extends 'base/base_login.html' %}

{% block title %}Senha Alterada{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box text-center">
        
        <div class="mb-4">
            <i class="fas fa-check-circle fa-4x text-success"></i>
        </div>

        <h3 class="fw-bold mb-3">Tudo Certo!</h3>
        
        <p class="text-muted mb-4">
            Sua senha foi alterada com sucesso.<br>
            Agora você já pode acessar o sistema com sua nova credencial.
        </p>
        
        <a href="{% url 'login' %}" class="btn btn-primary-custom w-100 text-white fw-bold py-2">
            <i class="fas fa-sign-in-alt me-2"></i> Fazer Login
        </a>

    </div>
</div>
{% endblock %}
