{% extends 'base/base.html' %}
{% load static %}

{% block title %}{{ action }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            
            <div class="card-custom">
                <div class="card-header-custom">
                    <h4 class="mb-0">
                        <i class="fas fa-map-marker-alt me-2"></i>{{ action }}
                    </h4>
                </div>

                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Nome da Base</label>
                            {{ form.nome }}
                            {% if form.nome.errors %}
                                <div class="text-danger small">{{ form.nome.errors }}</div>
                            {% endif %}
                        </div>
                        
                        <hr class="border-secondary opacity-25 my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'base_list' %}" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-success-custom px-4 fw-bold">
                                <i class="fas fa-check me-2"></i> Salvar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
