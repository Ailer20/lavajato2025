{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Locais de Armazenamento</h2>
        <a href="{% url 'local_create' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Novo Local
        </a>
    </div>

    <div class="card-custom">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Nome / Identificação</th>
                        <th>Descrição</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for local in locais %}
                    <tr>
                        <td class="fw-bold">{{ local.nome }}</td>
                        <td class="text-muted">{{ local.descricao|default:"-" }}</td>
                        <td class="text-end">
                            <a href="{% url 'local_update' local.pk %}" class="btn btn-sm btn-outline-info">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted">Nenhum local cadastrado.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3">
        <a href="{% url 'estoque_lista' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Voltar para Estoque
        </a>
    </div>
</div>
{% endblock %}
