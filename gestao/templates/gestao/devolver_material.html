{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom border-warning">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-undo me-2"></i>Devolver ao Almoxarifado</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-dark mb-4">
                        <small>Ao confirmar, o item sairá da sua lista e voltará para o estoque central da empresa.</small>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                            </div>
                        {% endfor %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning fw-bold">Confirmar Devolução</button>
                            <a href="{% url 'meu_estoque_pessoal' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
