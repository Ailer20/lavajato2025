{% extends 'base/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="fas fa-tags me-2"></i>Categorias de Produtos</h2>
        <a href="{% url 'categoria_create' %}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Nova Categoria
        </a>
    </div>

    <div class="card-custom">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Nome da Categoria</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td class="fw-bold">{{ cat.nome }}</td>
                        <td class="text-end">
                            <a href="{% url 'categoria_update' cat.pk %}" class="btn btn-sm btn-outline-info">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">Nenhuma categoria cadastrada.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-3">
        <a href="{% url 'estoque_lista' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Voltar para Estoque
        </a>
    </div>
</div>
{% endblock %}
